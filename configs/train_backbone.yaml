schema_version: 1  # released backbone training protocol
seed: 1234

split_protocol: official_train_test
checkpoint_policy: last_epoch
test_monitor_interval: 1
test_monitor_for_checkpoint_selection: false
test_monitor_for_early_stopping: false

feature_builder:
  coordinate_source: image_xyz
  motion_lags: [1]
  max_hold_frames: 5
  missing_clip_frames: 30
  include_handedness: true

targets:
  boundary_radius: 2

model:
  input_dim: 135
  hidden_dim: 128
  num_classes: 14
  kernel_size: 3
  dilations: [1, 2, 4, 8, 16, 32]
  dropout: 0.1

training:
  epochs: 80
  batch_size: 32
  samples_per_epoch: 1024
  clip_length: 256
  minimum_warmup_context: 126
  supervised_length: 128
  center_jitter: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  scheduler: cosine
  amp: false
  num_workers: 0
  missing_augmentation_probability: 0.25
  missing_augmentation_max_frames: 12
  loss_weights:
    frame: 1.0
    start: 0.5
    end: 0.5

evaluation:
  chunk_size: 2048
  video_batch_size: 8

# Fixed before Official Test evaluation; not selected from Test curves.
decoder:
  ema_alpha: 0.6
  activation_threshold: 0.45
  sustain_threshold: 0.25
  background_threshold: 0.60
  boundary_threshold: 0.60
  candidate_frames: 3
  end_confirm_frames: 3
  switch_confirm_frames: 3
  min_event_frames: 8
  cooldown_frames: 6
  dedup_gap_frames: 8
  dedup_tiou: 0.5
